[project]
name = "headlong-discord-bridge"
version = "0.1.0"
description = "Discord bridge for a Headlong identity, plus a discord.py runner for the agent"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
]

[project.scripts]
headlong-discord-bridge = "headlong_discord.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headlong_discord"]
